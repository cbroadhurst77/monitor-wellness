name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      # Immutable revisions avoid silently accepting a changed third-party action. The
      # trailing comments provide the human-readable release for scheduled review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # These are separate projects rather than a solution. Restore each one explicitly so
      # subsequent --no-restore steps work on a clean GitHub-hosted runner.
      - name: Restore application
        run: dotnet restore src/MonitorWellness/MonitorWellness.csproj

      - name: Restore tests
        run: dotnet restore tests/MonitorWellness.Tests/MonitorWellness.Tests.csproj

      - name: Build release application
        run: dotnet build src/MonitorWellness/MonitorWellness.csproj --configuration Release --no-restore --nologo -warnaserror

      # Runs the tests once, with coverage; the summary lands on the job page and a drop below the minimum fails.
      - name: Run tests with coverage
        shell: pwsh
        run: ./tools/Get-Coverage.ps1 -NoRestore -Minimum 50

      - name: Check known vulnerable dependencies
        shell: pwsh
        run: ./tools/Test-VulnerableDependencies.ps1 -ProjectPath tests/MonitorWellness.Tests/MonitorWellness.Tests.csproj

  # Validates the real release packaging path, including compiling the installer, on every run.
  # (It used to be compiled only on master pushes and tags, so a broken installer script passed the
  # pull-request check and would only have failed at release time.) No signing credentials are used.
  release-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Validate publish output and compile installer
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          ./tools/Test-ReleasePackage.ps1 -CompileInstaller

      # Kept so a release can attach the exact installer CI built from the tagged commit.
      - name: Upload installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: dist/MonitorWellness-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  # A pushed v* tag publishes the release from the installer CI just built from that exact commit.
  # Only this job can write to the repository, and only on tags. Prerelease tags (v1.2.3-beta) are not
  # accepted by the version check, so every release made here is a normal one.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, release-package]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: dist

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          . ./tools/ReleaseHelpers.ps1
          Assert-TagMatchesVersion -Root . -Tag $env:TAG
          $version = $env:TAG -replace '^v', ''
          Get-ReleaseNotes -ChangelogPath CHANGELOG.md -Version $version | Set-Content release-notes.md -Encoding utf8

          $installer = Get-ChildItem dist -Filter "MonitorWellness-Setup-$version.exe" | Select-Object -First 1
          if (-not $installer) { throw "dist has no installer for $version" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content dist/SHA256SUMS.txt -Encoding ascii

          gh release create $env:TAG $installer.FullName dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --title "Monitor Wellness $version" --notes-file release-notes.md --verify-tag
