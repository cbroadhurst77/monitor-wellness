name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      # Immutable revisions avoid silently accepting a changed third-party action. The
      # trailing comments provide the human-readable release for scheduled review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # These are separate projects rather than a solution. Restore each one explicitly so
      # subsequent --no-restore steps work on a clean GitHub-hosted runner.
      - name: Restore application
        run: dotnet restore src/MonitorWellness/MonitorWellness.csproj

      - name: Restore tests
        run: dotnet restore tests/MonitorWellness.Tests/MonitorWellness.Tests.csproj

      - name: Build release application
        run: dotnet build src/MonitorWellness/MonitorWellness.csproj --configuration Release --no-restore --nologo -warnaserror

      - name: Run tests
        run: dotnet test tests/MonitorWellness.Tests/MonitorWellness.Tests.csproj --configuration Release --no-restore --nologo

      - name: Check known vulnerable dependencies
        shell: pwsh
        run: ./tools/Test-VulnerableDependencies.ps1 -ProjectPath tests/MonitorWellness.Tests/MonitorWellness.Tests.csproj

  # Validates the real release packaging path, including compiling the installer, on every run.
  # (It used to be compiled only on master pushes and tags, so a broken installer script passed the
  # pull-request check and would only have failed at release time.) No signing credentials are used.
  release-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Validate publish output and compile installer
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          ./tools/Test-ReleasePackage.ps1 -CompileInstaller

      # Kept so a release can attach the exact installer CI built from the tagged commit.
      - name: Upload installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: dist/MonitorWellness-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
